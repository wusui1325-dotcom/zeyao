name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Prepare keystore
        env:
          KEYSTORE_B64: ${{ secrets.ZEYAO_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ZEYAO_STORE_PASS }}
          KEY_PASS: ${{ secrets.ZEYAO_KEY_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/keystore.jks
          echo "ZEYAO_KEYSTORE=${{ github.workspace }}/app/keystore.jks" >> $GITHUB_ENV
          echo "ZEYAO_STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
          echo "ZEYAO_KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
          echo "ZEYAO_KEY_ALIAS=zeyao" >> $GITHUB_ENV

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.1
          name: Zeyao 1.6.1
          body: |
            擇要 1.6.1
            - 版本升至 1.6.1，啟用 release minify + shrink
            - 更新依賴（Compose BOM、coroutines、jsoup、security-crypto）
            - 更穩健的 SSE 解析與摘要 prompt 截斷
            - 改善 AI 錯誤訊息
            - 新增摘要記憶體快取（10 分鐘）
            - 對應多項性能、穩定性與體驗優化
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
