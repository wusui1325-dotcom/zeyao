name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Prepare keystore
        env:
          KEYSTORE_B64: ${{ secrets.ZEYAO_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ZEYAO_STORE_PASS }}
          KEY_PASS: ${{ secrets.ZEYAO_KEY_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/keystore.jks
          echo "ZEYAO_KEYSTORE=${{ github.workspace }}/app/keystore.jks" >> $GITHUB_ENV
          echo "ZEYAO_STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
          echo "ZEYAO_KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
          echo "ZEYAO_KEY_ALIAS=zeyao" >> $GITHUB_ENV

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: Zeyao 1.4.0
          body: |
            擇要 1.0.0
            - 語言選擇（简 / 繁 / Eng）
            - 擇要頁更短、更長、重試、搜索新聞
            - DeepSeek 官方 Search API
            - 可調同網站冷卻
            - 懸浮窗點擊攔截
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
